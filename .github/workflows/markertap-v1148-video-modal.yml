name: MarkerTap v1.148 Kaitaku video modal regression

on:
  push:
    branches:
      - markertap/kaitaku-video-modal-v1.148
      - markertap/dialog-resume-v1.149
    paths:
      - 'markertap/v1.145-physical-return/**'
      - '.github/workflows/markertap-v1148-video-modal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Kaitaku video modality and existing recovery
        working-directory: markertap/v1.145-physical-return
        run: python3 run-tests.py
      - name: Compile signing/build scripts
        working-directory: markertap/v1.145-physical-return
        run: |
          python3 -m py_compile sign-release.py build.py setup-toolchain.py
          python3 sign-release.py --help > /dev/null
      - name: State actual scope
        run: echo 'Host tests only; no on-device input, baseline APK or private signing key in CI.'
