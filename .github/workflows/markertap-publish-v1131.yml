name: Publish verified MarkerTap v1.131 APK
on:
  push:
    branches: ["markertap/stability-v1.131"]
    paths:
      - ".github/workflows/markertap-publish-v1131.yml"
      - "markertap/release-recovery-v1131/**"
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MarkerTap-v1.131-stability
          path: stability-build-results
          github-token: ${{ github.token }}
          run-id: 39726318247
      - name: Publish identical signed APK and verify anonymous download
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 markertap/release-recovery-v1131/publish_ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MarkerTap-v1.131-public-release-verification
          path: stability-build-results/
          retention-days: 30
