name: Build FFC BANC888 FineTune APK

on:
  push:
    branches: [ "apk/banc888-finetune" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build full BANC v888 mobile data
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pyarrow
          python tools/build_banc_mobile.py app/src/main/assets
          echo "=== BANC mobile manifest ==="
          cat app/src/main/assets/banc888_manifest.json
          echo "=== Asset sizes ==="
          du -h app/src/main/assets/*

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK with BANC v888
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FFC-BANC888-FineTune-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/src/main/assets/banc888_manifest.json
          if-no-files-found: error
