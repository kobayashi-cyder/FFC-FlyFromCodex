name: MarkerTap toolchain bridge (Android 35 + JADX)
on:
  push:
    branches: ["markertap/recovery"]
    paths: [".github/workflows/markertap-toolchain-bridge.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Android components
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          mkdir -p transfer/platforms/android-35 transfer/build-tools/35.0.0
          cp "$ANDROID_HOME/platforms/android-35/android.jar" transfer/platforms/android-35/
          cp -a "$ANDROID_HOME/build-tools/35.0.0/." transfer/build-tools/35.0.0/
          test -s transfer/platforms/android-35/android.jar
          test -s transfer/build-tools/35.0.0/lib/d8.jar
          test -x transfer/build-tools/35.0.0/apksigner
          test -x transfer/build-tools/35.0.0/zipalign
      - name: Fetch pinned JADX
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --output /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip
          echo "8280f3799c0273fe797a2bcd90258c943e451fd195f13d05400de5e6451d15ec  /tmp/jadx.zip" | sha256sum -c -
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          mkdir -p transfer/jadx/lib
          find /tmp/jadx -name 'jadx-1.5.3-all.jar' -exec cp {} transfer/jadx/lib/ \;
          test -s transfer/jadx/lib/jadx-1.5.3-all.jar
      - uses: actions/upload-artifact@v4
        with:
          name: MarkerTap-android-platform-35
          path: transfer/platforms
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: MarkerTap-android-build-tools-35
          path: transfer/build-tools
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: MarkerTap-jadx-1.5.3
          path: transfer/jadx
          retention-days: 3
