name: MarkerTap v1.139 F-52A real-screen flow safety CI
on:
  push:
    branches: ["markertap/f52a-physical-flow-v1.139"]
    paths:
      - "markertap/v1.139-f52a-physical/**"
      - ".github/workflows/markertap-v1139-f52a-physical.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify fresh-frame, resume gating, and bounded recovery
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f52a-logic-test"
          javac -d "$RUNNER_TEMP/f52a-logic-test" markertap/v1.139-f52a-physical/overlay/src/jp/tapmarker/PhysicalFlowRecovery.java markertap/v1.139-f52a-physical/tests/PhysicalFlowRecoveryTest.java
          java -cp "$RUNNER_TEMP/f52a-logic-test" jp.tapmarker.PhysicalFlowRecoveryTest
      - name: Android build environment
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          curl --fail --location --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip -o "$RUNNER_TEMP/jadx.zip"
          echo "8280f3799c0273fe797a2bcd90258c943e451fd195f13d05400de5e6451d15ec  $RUNNER_TEMP/jadx.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
      - name: Restore v1.138, patch shipping DEX, build and audit
        run: python3 markertap/v1.139-f52a-physical/build_ci.py --sdk "$ANDROID_HOME" --jadx "$RUNNER_TEMP/jadx/lib/jadx-1.5.3-all.jar"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MarkerTap-v1.139-F52A-unsigned-evidence
          path: f52a-physical-build-results/
          if-no-files-found: warn
          retention-days: 30
