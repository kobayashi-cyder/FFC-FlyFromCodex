name: Build G Bridge APK

on:
  push:
    branches:
      - gbridge-build
    paths:
      - "gbridge/**"
      - ".github/workflows/gbridge-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore G Bridge source
        shell: bash
        run: |
          cat gbridge/source/chunk*.b64 > /tmp/GBridge-source.zip.b64
          base64 --decode /tmp/GBridge-source.zip.b64 > /tmp/GBridge-source.zip
          mkdir -p /tmp/gbridge-src
          unzip -q /tmp/GBridge-source.zip -d /tmp/gbridge-src
          test -f /tmp/gbridge-src/GBridge/settings.gradle

      - name: Build debug APK
        working-directory: /tmp/gbridge-src/GBridge
        shell: bash
        run: |
          gradle --version
          gradle :app:assembleDebug --stacktrace --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/GBridge-debug.apk"

      - name: Hash APK
        shell: bash
        run: sha256sum GBridge-debug.apk | tee GBridge-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GBridge-debug-apk
          path: |
            GBridge-debug.apk
            GBridge-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
