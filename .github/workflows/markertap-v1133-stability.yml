name: MarkerTap v1.133 two-display isolation verification
on:
  push:
    branches: ["markertap/stability-v1.133"]
    paths:
      - ".github/workflows/markertap-v1133-stability.yml"
      - "markertap/v1.133-stability/**"
      - "markertap/code/TapMarker/src/jp/tapmarker/VirtualWindows.java"
      - "markertap/code/TapMarker/tests/FrameCircuitTest.java"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: markertap-v1133-stability
  cancel-in-progress: false
jobs:
  verify-or-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TAPMARKER_VALIDATE_ONLY: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[sign-v1133]') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Rebuild v1.132 baseline, apply v1.133 isolation, and run regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 markertap/v1.133-stability/build_ci.py
      - name: Archive host verification and build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MarkerTap-v1.133-validation
          path: stability-build-results/
          if-no-files-found: warn
          retention-days: 30
