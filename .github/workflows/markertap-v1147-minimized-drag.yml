name: MarkerTap v1.147 draggable minimized button regression

on:
  push:
    branches:
      - markertap/minimized-draggable-v1.147
    paths:
      - 'markertap/v1.145-physical-return/**'
      - '.github/workflows/markertap-v1147-minimized-drag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify physical recovery, draggable minimize, and production hooks
        working-directory: markertap/v1.145-physical-return
        run: python3 run-tests.py
      - name: Syntax check secure signing commands
        working-directory: markertap/v1.145-physical-return
        run: |
          python3 -m py_compile sign-release.py build.py setup-toolchain.py
          python3 sign-release.py --help > /dev/null
      - name: State scope of this CI check
        run: echo 'Host tests only. The signed APK was built privately with original signature outside CI. Device behavior untested.'
