name: Test and Build Ce3 Connectome APK

on:
  push:
    branches:
      - ce3-builder-v0.8
    paths:
      - 'ce3-android/**'
      - '.github/workflows/ce3-android-build.yml'

permissions:
  contents: read

concurrency:
  group: ce3-v0.8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests
        working-directory: ce3-android
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        working-directory: ce3-android
        run: gradle :app:lintDebug --stacktrace

      - name: Assemble debug APK
        working-directory: ce3-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK archive package and signature
        run: |
          APK="ce3-android/app/build/outputs/apk/debug/app-debug.apk"
          unzip -t "$APK" >/dev/null
          /usr/local/lib/android/sdk/build-tools/34.0.0/aapt dump badging "$APK" | tee /tmp/ce3-badging.txt
          grep -q "package: name='dev.ffc.ce3'" /tmp/ce3-badging.txt
          grep -q "launchable-activity: name='dev.ffc.ce3.MainActivity'" /tmp/ce3-badging.txt
          /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner verify --verbose "$APK"

      - name: Rename verified APK
        run: cp ce3-android/app/build/outputs/apk/debug/app-debug.apk ce3-android/app/build/outputs/apk/debug/FFC-Ce3-Builder-v0.8-debug.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: FFC-Ce3-Builder-v0.8
          path: ce3-android/app/build/outputs/apk/debug/FFC-Ce3-Builder-v0.8-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FFC-Ce3-v0.8-test-reports
          path: |
            ce3-android/app/build/reports/tests/testDebugUnitTest/**
            ce3-android/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
