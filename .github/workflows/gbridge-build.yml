name: Build G Bridge APK

on:
  push:
    branches:
      - gbridge-build
    paths:
      - "gbridge/**"
      - ".github/workflows/gbridge-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android API 36
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore G Bridge source
        shell: bash
        run: |
          cat gbridge/source/chunk00.b64 gbridge/source/chunk01.b64 gbridge/source/chunk02.b64 gbridge/source/chunk03a.b64 gbridge/source/chunk03b.b64 gbridge/source/chunk04.b64 gbridge/source/chunk05.b64 > /tmp/GBridge-source.zip.b64
          base64 --decode /tmp/GBridge-source.zip.b64 > /tmp/GBridge-source.zip
          rm -rf /tmp/gbridge-src
          mkdir -p /tmp/gbridge-src
          unzip -q /tmp/GBridge-source.zip -d /tmp/gbridge-src
          test -f /tmp/gbridge-src/GBridge/settings.gradle
          sed -i "s/compileSdk 37/compileSdk 36/; s/targetSdk 37/targetSdk 36/" /tmp/gbridge-src/GBridge/app/build.gradle

      - name: Build debug APK
        working-directory: /tmp/gbridge-src/GBridge
        shell: bash
        run: |
          gradle --version
          gradle :app:assembleDebug --stacktrace --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/GBridge-debug.apk"

      - name: Hash APK
        shell: bash
        run: sha256sum GBridge-debug.apk | tee GBridge-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GBridge-debug-apk
          path: |
            GBridge-debug.apk
            GBridge-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
