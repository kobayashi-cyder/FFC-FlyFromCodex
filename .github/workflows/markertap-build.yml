name: MarkerTap connection-recovery APK
on:
  push:
    branches: ["markertap/recovery"]
    paths:
      - ".github/workflows/markertap-build.yml"
      - "markertap/code/**"
      - "markertap/tools/build_source.py"
      - "markertap/tools/restore_source.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: markertap-native-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android build tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          if ! command -v rg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi
      - name: Build and verify MarkerTap with the private signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 markertap/tools/build_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MarkerTap-v1.120-connection-recovery
          path: markertap/releases/*
          if-no-files-found: ignore
          retention-days: 90
