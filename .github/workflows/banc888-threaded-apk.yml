name: BANC888 Threaded Voice APK

on:
  push:
    branches:
      - "banc888-apk-*"
    paths:
      - "app/**"
      - "tests/thread_router_core.test.cjs"
      - "tests/capability_vocabulary.test.cjs"
      - "tests/specialist_capability_v2.test.cjs"
      - "tests/ir_patch_core.test.cjs"
      - "tests/proxy_agent_core.test.cjs"
      - "tests/proxy_apk_integration.test.cjs"
      - "tests/conversation_output_core.test.cjs"
      - "tests/research_physics_core.test.cjs"
      - "tests/route_on_switch_only.test.cjs"
      - "tests/live_manifest_verify.test.cjs"
      - "tests/webview_runtime_contract.test.cjs"
      - "tests/image_quality_core.test.cjs"
      - "tests/feedback_core.test.cjs"
      - "tests/autonomy_core.test.cjs"
      - "tests/connectome_selector.test.cjs"
      - "tests/connectome_mobile.test.cjs"
      - "tests/connectome_multiplex.test.cjs"
      - "tests/task_review.test.cjs"
      - "tests/fixtures/connectome_reference.cjs"
      - "tools/connectome_mobile_benchmark.cjs"
      - "tests/research_physics_core.test.cjs"
      - ".github/workflows/banc888-threaded-apk.yml"
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "tools/connectome_mobile_benchmark.cjs"
      - ".github/workflows/banc888-threaded-apk.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android sdkmanager
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --list_installed | head -80 || true

      - name: Install Android platform
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Thread router unit tests
        run: |
          node --check app/src/main/assets/thread-router-core.js
          node --check app/src/main/assets/capability-vocabulary-core.js
          node --check app/src/main/assets/image-quality-core.js
          node --check app/src/main/assets/feedback-core.js
          node --check app/src/main/assets/autonomy-core.js
          node --check app/src/main/assets/research-physics-core.js
          node --check app/src/main/assets/ir-patch-core.js
          node --check app/src/main/assets/proxy-agent-core.js
          node --check app/src/main/assets/capability-tools.js
          node --check app/src/main/assets/research-physics-tools.js
          node --check app/src/main/assets/proxy-agent.js
          node --check app/src/main/assets/conversation-output-core.js
          node --check app/src/main/assets/thread-router.js
          node --check app/src/main/assets/dev-live.js
          node --check app/src/main/assets/native-bridge.js
          node --check app/src/main/assets/webview-runtime.js
          node tests/thread_router_core.test.cjs
          node tests/capability_vocabulary.test.cjs
          node tests/image_quality_core.test.cjs
          node tests/feedback_core.test.cjs
          node tests/autonomy_core.test.cjs
          node tests/specialist_capability_v2.test.cjs
          node tests/ir_patch_core.test.cjs
          node tests/proxy_agent_core.test.cjs
          node tests/connectome_selector.test.cjs
          node tests/connectome_mobile.test.cjs
          node tests/connectome_multiplex.test.cjs
          node tests/task_review.test.cjs
          node tests/video_export.test.cjs
          node tests/adaptive_quality.test.cjs
          node tests/proxy_apk_integration.test.cjs
          node tests/conversation_output_core.test.cjs
          node tests/research_physics_core.test.cjs
          node tests/route_on_switch_only.test.cjs
          node tests/live_manifest_verify.test.cjs
          node tests/webview_runtime_contract.test.cjs
          node tests/research_physics_core.test.cjs

      - name: Connectome CPU benchmark
        run: node --expose-gc tools/connectome_mobile_benchmark.cjs > connectome-mobile-benchmark.json

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: APK inventory
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BANC888-v7.6-connectome-mp4-debug.apk
          ls -lh BANC888-v7.6-connectome-mp4-debug.apk
          sha256sum BANC888-v7.6-connectome-mp4-debug.apk > BANC888-v7.6-connectome-mp4-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BANC888-v7.6-connectome-mp4-debug
          path: |
            BANC888-v7.6-connectome-mp4-debug.apk
            BANC888-v7.6-connectome-mp4-debug.apk.sha256
            connectome-mobile-benchmark.json
          if-no-files-found: error
          retention-days: 30
