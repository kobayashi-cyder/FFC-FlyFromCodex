name: BANC888 Parallel Integration Tests

on:
  push:
    branches:
      - "banc888-apk-*"
    paths:
      - "app/**"
      - "tests/**"
      - ".github/workflows/banc888-linked-integration.yml"
      - ".github/scripts/banc888-voice-ci.sh"
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - ".github/workflows/banc888-linked-integration.yml"
      - ".github/scripts/banc888-voice-ci.sh"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Test • Contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Web/runtime contract
        run: node tests/webview_runtime_contract.test.cjs

  android:
    name: Test • ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: WebView bridge
            class: com.ffc.banc888.fly.BridgeIntegrationTest
            fixture: false
          - name: Microphone API
            class: com.ffc.banc888.fly.MicrophoneIntegrationTest
            fixture: false
          - name: SpeechRecognizer PCM
            class: com.ffc.banc888.fly.SpeechRecognizerIntegrationTest
            fixture: true
          - name: TTS
            class: com.ffc.banc888.fly.TtsIntegrationTest
            fixture: false
          - name: Voice UI routing
            class: com.ffc.banc888.fly.VoiceUiIntegrationTest
            fixture: false
          - name: Image candidate ranking
            class: com.ffc.banc888.fly.ImageQualityIntegrationTest
            fixture: false
          - name: Autonomous capability learning
            class: com.ffc.banc888.fly.AutonomyIntegrationTest
            fixture: false
          - name: Connectome mobile
            class: com.ffc.banc888.fly.ConnectomeMobileIntegrationTest
            fixture: false
          - name: Conversation knowledge
            class: com.ffc.banc888.fly.ConversationKnowledgeIntegrationTest
            fixture: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build app and test APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Prepare injected speech fixture
        if: matrix.fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng sox
          espeak-ng -v en-us -s 130 -a 180 -w /tmp/ci-mic-speech.wav "hello this is a speech recognition test"
          sox /tmp/ci-mic-speech.wav -r 16000 -c 1 -b 16 -e signed-integer -t raw /tmp/ci-mic-speech.raw
          test -s /tmp/ci-mic-speech.raw

      - name: Run ${{ matrix.name }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST_NAME: ${{ matrix.name }}
          TEST_CLASS: ${{ matrix.class }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -noaudio
          script: bash .github/scripts/banc888-voice-ci.sh
