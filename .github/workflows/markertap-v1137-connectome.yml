name: MarkerTap v1.137 connectome multiplex validation
on:
  push:
    branches: ["markertap/connectome-multiplex-v1.137"]
    paths:
      - "markertap/v1.137-connectome/**"
      - "markertap/v1.136-frameguard/**"
      - ".github/workflows/markertap-v1137-connectome.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile and run independent two-lane event-graph tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/connectome-test"
          javac -d "$RUNNER_TEMP/connectome-test" markertap/v1.137-connectome/overlay/src/jp/tapmarker/ConnectomeMultiplexer.java markertap/v1.137-connectome/tests/ConnectomeMultiplexerTest.java
          java -cp "$RUNNER_TEMP/connectome-test" jp.tapmarker.ConnectomeMultiplexerTest
      - name: Prepare Android SDK and verified JADX
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          curl --fail --location --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip -o "$RUNNER_TEMP/jadx.zip"
          echo "8280f3799c0273fe797a2bcd90258c943e451fd195f13d05400de5e6451d15ec  $RUNNER_TEMP/jadx.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
      - name: Restore, compile, Java regressions and DEX audit
        run: python3 markertap/v1.137-connectome/build_ci.py --sdk "$ANDROID_HOME" --jadx "$RUNNER_TEMP/jadx/lib/jadx-1.5.3-all.jar"
      - name: Save validation evidence (unsigned unless signer provided)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MarkerTap-v1.137-connectome-evidence
          path: connectome-build-results/
          if-no-files-found: warn
          retention-days: 30
