name: BANC888 Threaded Voice APK

on:
  push:
    branches:
      - "banc888-apk-*"
    paths:
      - "app/**"
      - "tests/thread_router_core.test.cjs"
      - ".github/workflows/banc888-threaded-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Thread router unit tests
        run: |
          node --check app/src/main/assets/thread-router-core.js
          node --check app/src/main/assets/thread-router.js
          node tests/thread_router_core.test.cjs

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: APK inventory
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BANC888-v5.3-threaded-voice-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
