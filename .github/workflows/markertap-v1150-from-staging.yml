name: Publish verified MarkerTap v1.150 signed APK from staging chunks

on:
  push:
    branches:
      - markertap/no-redundant-taps-v1.150
    paths:
      - '.release-staging/markertap-v1150/**'
      - '.github/workflows/markertap-v1150-from-staging.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: markertap-v1150-verified-binary-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: markertap/no-redundant-taps-v1.150
      - name: Reconstruct EXACT already-signed APK from public binary chunks
        run: |
          set -euo pipefail
          mkdir -p dist
          test "$(find .release-staging/markertap-v1150 -name 'chunk-*.b64' | wc -l)" -eq 30
          cat .release-staging/markertap-v1150/chunk-*.b64 | base64 --decode > dist/MarkerTap-v1.150-integrated-signed.apk
          echo '58e6cd830350473dad218352b3e23f4efcb214b2624e1122823ceb1093345067  dist/MarkerTap-v1.150-integrated-signed.apk' | sha256sum --check
          test "$(stat -c%s dist/MarkerTap-v1.150-integrated-signed.apk)" -eq 5647203
          cp markertap/v1.145-physical-return/v1.150-SHA256SUMS.txt dist/SHA256SUMS-v1.150.txt
      - name: Install Android signature validation tools
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - name: Verify original certificate, v2/v3 signing, alignment, package and ZIP CRC
        run: |
          set -euo pipefail
          apk=dist/MarkerTap-v1.150-integrated-signed.apk
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/apksigner" verify --verbose --print-certs "$apk" > dist/signature-check.txt
          grep -F 'Signer #1 certificate SHA-256 digest: 7f42d636e4d3c251f475eb998fbe8e92b515ded8bce3ff4d30aa90b9a738cfb1' dist/signature-check.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/signature-check.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' dist/signature-check.txt
          "$bt/zipalign" -c -P 16 4 "$apk"
          "$bt/aapt2" dump badging "$apk" > dist/badging.txt
          grep -F "name='jp.tapmarker.lite' versionCode='153' versionName='1.150'" dist/badging.txt
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("dist/MarkerTap-v1.150-integrated-signed.apk") as z:
              assert z.testzip() is None,"Corrupt APK ZIP CRC"
          print("Signed APK content checked")
          PY
      - name: Create GitHub Release with signed APK and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view markertap-v1.150 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release exists; do not silently overwrite. Inspect existing SHA first.'
            exit 1
          fi
          gh release create markertap-v1.150 \
            dist/MarkerTap-v1.150-integrated-signed.apk \
            dist/SHA256SUMS-v1.150.txt \
            --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" \
            --title 'MarkerTap v1.150 signed integrated APK' \
            --notes 'Original certificate / APK v2+v3 / ZIP CRC / host tests verified. Pixel 10 real-device operation and 2-display autoplay are not yet validated.' \
            --prerelease --latest=false
      - name: Verify completely public APK download and checksum
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/markertap-v1.150/MarkerTap-v1.150-integrated-signed.apk"
          curl -fLsS --retry 8 --retry-delay 2 "$url" -o dist/downloaded-public.apk
          cmp dist/downloaded-public.apk dist/MarkerTap-v1.150-integrated-signed.apk
          echo '58e6cd830350473dad218352b3e23f4efcb214b2624e1122823ceb1093345067  dist/downloaded-public.apk' | sha256sum --check
          echo 'PUBLIC DOWNLOAD VERIFIED: v1.150 original signed APK'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MarkerTap-v1150-release-checks
          path: |
            dist/signature-check.txt
            dist/badging.txt
            dist/SHA256SUMS-v1.150.txt
          if-no-files-found: ignore
          retention-days: 30
