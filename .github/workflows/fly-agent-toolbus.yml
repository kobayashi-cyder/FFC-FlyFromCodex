name: Fly Agent ToolBus
on:
  pull_request:
    paths:
      - 'tools/fly_agent_toolbus.py'
      - 'tools/fly_agent_toolbus_browser.js'
      - 'contracts/fly_agent_toolbus_v0_2.json'
      - 'tests/test_fly_agent_toolbus.py'
      - 'tests/test_fly_agent_contract.py'
      - 'tests/fly_agent_toolbus_browser.test.js'
      - '.github/workflows/fly-agent-toolbus.yml'
  push:
    paths:
      - 'tools/fly_agent_toolbus.py'
      - 'tools/fly_agent_toolbus_browser.js'
      - 'contracts/fly_agent_toolbus_v0_2.json'
      - 'tests/test_fly_agent_toolbus.py'
      - 'tests/test_fly_agent_contract.py'
      - 'tests/fly_agent_toolbus_browser.test.js'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest -v tests/test_fly_agent_toolbus.py tests/test_fly_agent_contract.py
      - run: node tests/fly_agent_toolbus_browser.test.js
