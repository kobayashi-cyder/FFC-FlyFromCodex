name: MarkerTap v1.137 original-certificate signed release
on:
  push:
    branches:
      - "markertap/publish-signed-v1.137"
    paths:
      - ".github/workflows/markertap-publish-v1137-signed.yml"
      - "markertap/v1.137-connectome/publish_signed_ci.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Obtain audited unsigned v1.137 APK
        uses: actions/download-artifact@v4
        with:
          name: MarkerTap-v1.137-connectome-evidence
          path: signed-upload-input
          github-token: ${{ github.token }}
          run-id: 40015180432
      - name: Install Android signature verification tools
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - name: Receive ephemeral encrypted signer, sign and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 markertap/v1.137-connectome/publish_signed_ci.py
      - name: Preserve nonsecret verification receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MarkerTap-v1.137-signed-release-receipt
          path: signed-publication/validation.json
          if-no-files-found: ignore
          retention-days: 30
