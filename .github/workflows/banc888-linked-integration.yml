name: BANC888 Linked Emulator Test

on:
  push:
    branches:
      - "banc888-apk-*"
    paths:
      - "app/**"
      - ".github/workflows/banc888-linked-integration.yml"
      - ".github/scripts/banc888-voice-ci.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linked-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build app and test APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Prepare injected speech fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng sox
          espeak-ng -v en-us -s 130 -a 180 -w /tmp/ci-mic-speech.wav "hello this is a speech recognition test"
          sox /tmp/ci-mic-speech.wav -r 16000 -c 1 -b 16 -e signed-integer -t raw /tmp/ci-mic-speech.raw
          test -s /tmp/ci-mic-speech.raw
          ls -l /tmp/ci-mic-speech.raw

      - name: Real linked Android/WebView + audio-path test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -noaudio
          script: bash .github/scripts/banc888-voice-ci.sh
