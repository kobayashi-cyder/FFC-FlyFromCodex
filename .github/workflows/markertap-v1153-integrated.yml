name: MarkerTap v1.153 full unsigned DEX integration preflight

on:
  push:
    branches:
      - markertap/v1.153-integrated-release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch exact original-signed v1.151 binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base"
          gh release download markertap-v1.151-rc1 -R "$GITHUB_REPOSITORY"             -p MarkerTap-v1.151-integrated-signed.apk -D "$RUNNER_TEMP/base"
          echo "ae2db2972780e50966f26243ab5fd8f2f6d9106056eeda233a2d75a1f9535dab  $RUNNER_TEMP/base/MarkerTap-v1.151-integrated-signed.apk" | sha256sum -c -
      - name: Prepare checksum-pinned Android SDK35 and JADX/dexlib2
        working-directory: markertap/v1.145-physical-return
        run: python3 setup-toolchain.py
      - name: Test per-display decision logic and source ABI wiring
        working-directory: markertap/v1.145-physical-return
        run: python3 run-tests.py
      - name: Build, audit and version-integrate unsigned 1.153 APK
        working-directory: markertap/v1.145-physical-return
        run: |
          set -euo pipefail
          python3 build-v153-from-v151.py             --baseline "$RUNNER_TEMP/base/MarkerTap-v1.151-integrated-signed.apk"             --sdk tooling/sdk             --jadx tooling/jadx/lib/jadx-1.5.3-all.jar
          sha256sum output/MarkerTap-v1.153-integrated-unsigned.apk
      - name: Upload unsigned audit artifact only (NOT installable)
        uses: actions/upload-artifact@v4
        with:
          name: MarkerTap-v153-unsigned-BYTECODE-AUDITED-NOT-SIGNED
          retention-days: 3
          if-no-files-found: error
          path: |
            markertap/v1.145-physical-return/output/MarkerTap-v1.153-integrated-unsigned.apk
            markertap/v1.145-physical-return/build/v153-incremental/evidence/*
