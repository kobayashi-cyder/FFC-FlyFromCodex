name: MarkerTap v1.151 original-certificate signed prerelease

on:
  push:
    branches:
      - markertap/v1.151-virtual-lane-isolation
    paths:
      - '.github/workflows/markertap-v1151-signed-prerelease.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: markertap-v1151-original-signer-prerelease
  cancel-in-progress: false

jobs:
  sign-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: markertap/v1.151-virtual-lane-isolation
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fail closed when original signer is not configured
        env:
          ORIGINAL_KEY_B64: ${{ secrets.MARKERTAP_SIGNING_JKS_BASE64 }}
          ORIGINAL_STORE_PASSWORD: ${{ secrets.MARKERTAP_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ORIGINAL_KEY_B64" ] || [ -z "$ORIGINAL_STORE_PASSWORD" ]; then
            echo 'BLOCKED: the ORIGINAL MarkerTap keystore and store password are not available in GitHub Actions secrets.'
            echo 'Required secrets: MARKERTAP_SIGNING_JKS_BASE64 and MARKERTAP_STORE_PASSWORD.'
            echo 'No signing, release upload, or README replacement was performed.'
            exit 1
          fi
          echo 'Original-signer secrets configured. Contents are never printed.'
      - name: Download and SHA-verify official signed v1.150 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/markertap-public"
          gh release download markertap-v1.150 -R "$GITHUB_REPOSITORY" -p 'MarkerTap-v1.150-integrated-signed.apk' -D "$RUNNER_TEMP/markertap-public"
          echo "58e6cd830350473dad218352b3e23f4efcb214b2624e1122823ceb1093345067  $RUNNER_TEMP/markertap-public/MarkerTap-v1.150-integrated-signed.apk" | sha256sum --check -
      - name: Install checksum-pinned SDK35 and JADX
        working-directory: markertap/v1.145-physical-return
        run: python3 setup-toolchain.py
      - name: Run source/JVM regressions, build and independently audit unsigned APK
        working-directory: markertap/v1.145-physical-return
        run: |
          set -euo pipefail
          python3 run-tests.py
          python3 build-v151-from-v150.py \
            --baseline "$RUNNER_TEMP/markertap-public/MarkerTap-v1.150-integrated-signed.apk" \
            --sdk tooling/sdk \
            --jadx tooling/jadx/lib/jadx-1.5.3-all.jar
          echo '54cfccffa8bd6b5149fb2da563088b1cd3dde85037f567a33182308619d8befe  output/MarkerTap-v1.151-integrated-unsigned.apk' | sha256sum --check -
      - name: Create original key in ephemeral runner and SIGN, verify certificate
        working-directory: markertap/v1.145-physical-return
        env:
          ORIGINAL_KEY_B64: ${{ secrets.MARKERTAP_SIGNING_JKS_BASE64 }}
          MARKERTAP_STORE_PASSWORD: ${{ secrets.MARKERTAP_STORE_PASSWORD }}
          MARKERTAP_KEY_PASSWORD: ${{ secrets.MARKERTAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/markertap-private"
          printf '%s' "$ORIGINAL_KEY_B64" | base64 --decode > "$RUNNER_TEMP/markertap-private/original.jks"
          unset ORIGINAL_KEY_B64
          python3 sign-release.py \
            --unsigned output/MarkerTap-v1.151-integrated-unsigned.apk \
            --keystore "$RUNNER_TEMP/markertap-private/original.jks" \
            --sdk tooling/sdk \
            --out output/MarkerTap-v1.151-integrated-signed.apk
          sha256sum output/MarkerTap-v1.151-integrated-signed.apk > output/SHA256SUMS-v1.151.txt
      - name: Publish audited signed RC APK (NOT stable / not device-tested)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view markertap-v1.151-rc1 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'STOP: RC tag already exists; avoid silently overwriting signed bytes.'
            exit 1
          fi
          gh release create markertap-v1.151-rc1 \
            markertap/v1.145-physical-return/output/MarkerTap-v1.151-integrated-signed.apk \
            markertap/v1.145-physical-return/output/SHA256SUMS-v1.151.txt \
            markertap/v1.145-physical-return/output/MarkerTap-v1.151-integrated-signed.validation.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title 'MarkerTap v1.151 signed candidate (Pixel 10 validation pending)' \
            --notes 'Signed with the same original update certificate as v1.150 and host/DEX verified. NOT yet approved as stable: Pixel 10/Android 17, two virtual screens, collapse/restore offline behavior, ads, and reward continuity require device validation. v1.150 remains the current stable download. No new/private signing keys are published.' \
            --prerelease --latest=false
      - name: Verify public signed download has exact signed bytes
        working-directory: markertap/v1.145-physical-return
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/markertap-v1.151-rc1/MarkerTap-v1.151-integrated-signed.apk"
          for n in 1 2 3 4 5 6 7 8; do
            if curl --fail --location --silent --show-error --retry 2 "$url" -o "$RUNNER_TEMP/markertap-public/verify-v151.apk" && \
               cmp -s "$RUNNER_TEMP/markertap-public/verify-v151.apk" output/MarkerTap-v1.151-integrated-signed.apk; then
              echo "Original-certificate signed RC download verified: $url"
              exit 0
            fi
            sleep 3
          done
          echo 'STOP: public signed download is unavailable or differs from expected bytes.'
          exit 1
      - name: Erase ephemeral private signer from runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/markertap-private"
