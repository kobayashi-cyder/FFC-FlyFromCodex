name: MarkerTap v1.155 original-certificate signed stability candidate

on:
  push:
    branches:
      - markertap/v1.155-crashloop-rollback
    paths:
      - '.github/workflows/markertap-v1155-signed-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: markertap-v1155-original-signer
  cancel-in-progress: false

jobs:
  sign-audited-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: markertap/v1.155-crashloop-rollback
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use original signed v1.151 as verified recovery baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base"
          gh release download markertap-v1.151-rc1 -R "$GITHUB_REPOSITORY" \
            -p MarkerTap-v1.151-integrated-signed.apk -D "$RUNNER_TEMP/base"
          echo "ae2db2972780e50966f26243ab5fd8f2f6d9106056eeda233a2d75a1f9535dab  $RUNNER_TEMP/base/MarkerTap-v1.151-integrated-signed.apk" | sha256sum -c -
      - name: Install pinned Android SDK and dexlib2
        working-directory: markertap/v1.145-physical-return
        run: python3 setup-toolchain.py
      - name: Regression tests, bounded offline retries, and exact unsigned DEX audit
        working-directory: markertap/v1.145-physical-return
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/policy"
          javac --release 8 -encoding UTF-8 -d "$RUNNER_TEMP/policy" \
            ../code/TapMarker/src/jp/tapmarker/LoopbackRoutePolicy.java \
            ../code/TapMarker/tests/LoopbackRoutePolicyTest.java \
            src/jp/tapmarker/LoopbackRetryPolicy.java \
            ../code/TapMarker/tests/LoopbackRetryPolicyTest.java
          java -cp "$RUNNER_TEMP/policy" jp.tapmarker.LoopbackRoutePolicyTest
          java -cp "$RUNNER_TEMP/policy" jp.tapmarker.LoopbackRetryPolicyTest
          python3 run-tests.py
          python3 build-v155-from-v151.py \
            --baseline "$RUNNER_TEMP/base/MarkerTap-v1.151-integrated-signed.apk" \
            --sdk tooling/sdk \
            --jadx tooling/jadx/lib/jadx-1.5.3-all.jar
          echo '71524f44940769b4eab75286134f43f01589b34c9829fd3b61f0a56e5a0669be  output/MarkerTap-v1.155-integrated-unsigned.apk' | sha256sum -c -
      - name: One-time original-key encrypted signing and public verification
        working-directory: markertap/v1.145-physical-return
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -u one-shot-v155-release.py
      - name: Enforce no private keystore in source or artifacts
        if: always()
        run: |
          echo 'Original JKS and password were received only via encrypted short-lived handoff.'
          echo 'No JKS or password is uploaded to GitHub releases or Actions artifacts.'
