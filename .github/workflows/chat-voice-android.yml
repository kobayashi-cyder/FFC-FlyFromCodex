name: Chat Voice Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'chat-voice-bridge/**'
      - '.github/workflows/chat-voice-android.yml'
  pull_request:
    paths:
      - 'chat-voice-bridge/**'
      - '.github/workflows/chat-voice-android.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: chat-voice-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Provision Android SDK
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run pure Java tests
        run: bash scripts/test-core.sh
      - name: Build Android APK (debug key)
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify debug APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatVoiceBridge-debug-apk
          path: chat-voice-bridge/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # A release is built only when all four secrets exist. Never commit signing secrets.
      - name: Detect signing configuration
        id: signing
        env:
          KS_B64: ${{ secrets.CHAT_VOICE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.CHAT_VOICE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CHAT_VOICE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.CHAT_VOICE_KEY_PASSWORD }}
        run: |
          if [[ -n "$KS_B64" && -n "$KS_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed release
        if: steps.signing.outputs.ready == 'true'
        env:
          KS_B64: ${{ secrets.CHAT_VOICE_KEYSTORE_BASE64 }}
          CHAT_VOICE_STORE_PASSWORD: ${{ secrets.CHAT_VOICE_STORE_PASSWORD }}
          CHAT_VOICE_KEY_ALIAS: ${{ secrets.CHAT_VOICE_KEY_ALIAS }}
          CHAT_VOICE_KEY_PASSWORD: ${{ secrets.CHAT_VOICE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export CHAT_VOICE_KEYSTORE_FILE="$RUNNER_TEMP/chatvoice-release.jks"
          printf '%s' "$KS_B64" | base64 -d > "$CHAT_VOICE_KEYSTORE_FILE"
          chmod 600 "$CHAT_VOICE_KEYSTORE_FILE"
          trap 'rm -f "$CHAT_VOICE_KEYSTORE_FILE"' EXIT
          gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Upload signed release
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ChatVoiceBridge-signed-release
          path: chat-voice-bridge/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
