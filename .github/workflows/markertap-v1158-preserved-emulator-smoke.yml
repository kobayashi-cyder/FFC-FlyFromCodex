name: MarkerTap 1.158 retained-DEX Android15 emulator startup and AccessibilityService smoke
on:
  push:
    branches: ["markertap/v1.157-preserved-reward-evaluation"]
    paths:
      - ".github/workflows/markertap-v1158-preserved-emulator-smoke.yml"
      - "markertap/v1.158-binary-overlay/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android35-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch exact released signed v1.157 binary and pinned SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base"
          gh release download markertap-v1.157-rc1 -R "$GITHUB_REPOSITORY" \
            -p MarkerTap-v1.157-integrated-signed.apk -D "$RUNNER_TEMP/base"
          echo '0108aadfa717c676dfe30b4f678a5c1526277e11b01ae16f85317d8b8dd50f7d  '"$RUNNER_TEMP"'/base/MarkerTap-v1.157-integrated-signed.apk' | sha256sum -c -
          python3 markertap/v1.145-physical-return/setup-toolchain.py
      - name: Build full-preservation DEX and create disposable emulator-only signature
        run: |
          set -euo pipefail
          SDK=markertap/v1.145-physical-return/tooling/sdk
          python3 markertap/v1.158-binary-overlay/build-v158-from-v157.py \
            --baseline "$RUNNER_TEMP/base/MarkerTap-v1.157-integrated-signed.apk" \
            --sdk "$SDK" \
            --jadx markertap/v1.145-physical-return/tooling/jadx/lib/jadx-1.5.3-all.jar
          SRC=markertap/v1.158-binary-overlay/output/MarkerTap-v1.158-preserved-unsigned.apk
          python3 markertap/tools/audit_v157_apk_parity.py \
            --baseline "$RUNNER_TEMP/base/MarkerTap-v1.157-integrated-signed.apk" \
            --candidate "$SRC" --report "$RUNNER_TEMP/emulator-full-parity.json"
          keytool -genkeypair -noprompt -keyalg RSA -keysize 2048 -validity 2 \
            -alias ephemeral -keystore "$RUNNER_TEMP/emulator-only.jks" \
            -storepass android -keypass android \
            -dname "CN=Temporary Emulator Test"
          "$SDK/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/emulator-only.jks" --ks-key-alias ephemeral \
            --ks-pass pass:android --key-pass pass:android \
            --out "$RUNNER_TEMP/MarkerTap-v1.158-EMULATOR-ONLY-NOT-UPGRADEABLE.apk" "$SRC"
          "$SDK/build-tools/35.0.0/apksigner" verify --print-certs \
            "$RUNNER_TEMP/MarkerTap-v1.158-EMULATOR-ONLY-NOT-UPGRADEABLE.apk" \
            > "$RUNNER_TEMP/emulator-signature-report.txt"
          if grep -Fq '7f42d636e4d3c251f475eb998fbe8e92b515ded8bce3ff4d30aa90b9a738cfb1' \
              "$RUNNER_TEMP/emulator-signature-report.txt"; then
            echo 'STOP: temporary emulator certificate cannot be original signing certificate.'
            exit 1
          fi
      - name: Grant emulator KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android15 startup and AccessibilityService activation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb install -r "$RUNNER_TEMP/MarkerTap-v1.158-EMULATOR-ONLY-NOT-UPGRADEABLE.apk"
            adb shell am start -W -n jp.tapmarker.lite/jp.tapmarker.MainActivity
            sleep 3
            adb shell settings put secure enabled_accessibility_services jp.tapmarker.lite/jp.tapmarker.TapService
            adb shell settings put secure accessibility_enabled 1
            sleep 5
            adb shell pidof jp.tapmarker.lite
            adb logcat -d -b crash > "$RUNNER_TEMP/v158-preserved-emulator-crash.log"
            ! grep -Eq 'FATAL EXCEPTION|Process: jp.tapmarker.lite' "$RUNNER_TEMP/v158-preserved-emulator-crash.log"
            echo 'PASS Android15 basic startup and AccessibilityService launch. NO real game, ad or reward tested.'
      - name: Keep emulator diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MarkerTap-v1.158-preserved-DEX-Android15-emulator-logs-NO-APK
          path: |
            ${{ runner.temp }}/v158-preserved-emulator-crash.log
            ${{ runner.temp }}/emulator-full-parity.json
            ${{ runner.temp }}/emulator-signature-report.txt
          if-no-files-found: ignore
          retention-days: 7
