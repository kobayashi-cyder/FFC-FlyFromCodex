name: MarkerTap 1.145 physical foreground recovery regression

on:
  push:
    branches:
      - markertap/physical-return-v1.145
    paths:
      - "markertap/v1.145-physical-return/**"
      - ".github/workflows/markertap-v1145-physical-return.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-return-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and execute physical recovery regressions
        working-directory: markertap/v1.145-physical-return
        run: python3 run-tests.py
      - name: State result limits
        run: |
          echo "Host-only regression; does not build or sign an APK."
          echo "No device input, reward, or continuous autonomy validation."
