plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ffc.banc888.fly'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ffc.banc888.fly'
        minSdk 26
        targetSdk 35
        versionCode 58
        versionName '5.8-research-physics'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}
