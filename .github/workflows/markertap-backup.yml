name: MarkerTap recovery backup
on:
  push:
    branches: ["markertap/recovery"]
    paths:
      - ".github/workflows/markertap-backup.yml"
      - "markertap/tools/import_source.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: markertap-recovery-import
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Import the source without publishing transfer credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 markertap/tools/import_source.py
