name: MarkerTap v1.152 autonomous refresh source checks

on:
  push:
    branches:
      - markertap/v1.152-autonomous-refresh
    paths:
      - 'markertap/code/TapMarker/src/jp/tapmarker/VirtualWindows.java'
      - 'markertap/code/TapMarker/src/jp/tapmarker/VirtualRefreshPolicy.java'
      - 'markertap/code/TapMarker/tests/VirtualRefreshPolicyTest.java'
      - 'markertap/v1.145-physical-return/tests/test_virtual_refresh_source.py'
      - '.github/workflows/markertap-v1152-refresh.yml'
  pull_request:
    paths:
      - 'markertap/code/TapMarker/src/jp/tapmarker/VirtualWindows.java'
      - 'markertap/code/TapMarker/src/jp/tapmarker/VirtualRefreshPolicy.java'
      - 'markertap/code/TapMarker/tests/VirtualRefreshPolicyTest.java'
      - 'markertap/v1.145-physical-return/tests/test_virtual_refresh_source.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-java-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile v1.152 policy and test source wiring
        run: python3 markertap/v1.145-physical-return/tests/test_virtual_refresh_source.py
      - name: Publication gate
        run: |
          echo 'Source validation only. v1.152 Android DEX integration and signed APK are NOT validated.'
          echo 'Do not substitute v1.151 signed APK for unbuilt v1.152.'

  android-source-compile:
    needs: pure-java-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch checksum-pinned Android SDK35
        working-directory: markertap/v1.145-physical-return
        run: python3 setup-toolchain.py
      - name: Compile source-restored Android project (v1.152 policy and v1.158 wiring, no signing)
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          SDK="$ROOT/markertap/v1.145-physical-return/tooling/sdk"
          JAR="$SDK/platforms/android-35/android.jar"
          BT="$SDK/build-tools/35.0.0"
          test -f "$JAR"
          python3 markertap/tools/restore_source.py \
            --output "$RUNNER_TEMP/v152-compile-source.zip" \
            --extract-to "$RUNNER_TEMP/v152-compile-src"
          cd "$RUNNER_TEMP/v152-compile-src/TapMarker"
          python3 tools/generate-locales.py
          mkdir -p build/classes build/generated
          "$BT/aapt2" compile --dir res -o build/resources.zip
          "$BT/aapt2" link -o build/base.apk --manifest AndroidManifest.xml \
            -I "$JAR" --java build/generated --custom-package jp.tapmarker build/resources.zip
          LIBS=$(printf '%s:' libs/*.jar)
          find src build/generated third-party/libadb-android-master/libadb/src/main/java \
            -name '*.java' | sort > build/v152-sources.txt
          java -jar toolchain/ecj.jar -nowarn -source 8 -target 8 -encoding UTF-8 \
            -classpath "$JAR:$LIBS" -d build/classes @build/v152-sources.txt
          test -f build/classes/jp/tapmarker/VirtualWindows.class
          test -f build/classes/jp/tapmarker/VirtualRefreshPolicy.class
          test -f build/classes/jp/tapmarker/RewardEvaluationConnectome.class
          echo 'Full restored Android source compiles, v1.152 refresh and v1.158 objective classes present. No APK signed here.'
