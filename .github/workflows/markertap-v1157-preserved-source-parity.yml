name: MarkerTap v1.157 baseline - Android source compile and ALL-class parity gate
on:
  push:
    branches: ["markertap/v1.157-preserved-reward-evaluation"]
    paths:
      - ".github/workflows/markertap-v1157-preserved-source-parity.yml"
      - "markertap/code/**"
      - "markertap/tools/check_preserved_features.py"
      - "markertap/tools/audit_v157_apk_parity.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download exact signed v1.157 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline"
          gh release download markertap-v1.157-rc1 -R "$GITHUB_REPOSITORY" \
            -p MarkerTap-v1.157-integrated-signed.apk -D "$RUNNER_TEMP/baseline"
          echo '0108aadfa717c676dfe30b4f678a5c1526277e11b01ae16f85317d8b8dd50f7d  '"$RUNNER_TEMP"'/baseline/MarkerTap-v1.157-integrated-signed.apk' | sha256sum -c -
      - name: Install Android SDK for compile-only validation
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          if ! command -v rg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi
      - name: Restore source archive and compile integrated reward modules
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -euo pipefail
          python3 markertap/tools/restore_source.py \
            --output "$RUNNER_TEMP/recovered-source.zip" \
            --extract-to "$RUNNER_TEMP/v157-evaluation-source"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export TAPMARKER_KEYSTORE="$RUNNER_TEMP/test-key-NOT-ORIGINAL.jks"
          export TAPMARKER_OUTPUT="$RUNNER_TEMP/test-only-do-not-install.apk"
          keytool -genkeypair -noprompt -keyalg RSA -keysize 2048 -validity 2 \
            -alias tapmarker -keystore "$TAPMARKER_KEYSTORE" \
            -storepass android -keypass android -dname "CN=Ephemeral CI Validation"
          (cd "$RUNNER_TEMP/v157-evaluation-source/TapMarker" && bash build.sh)
          test -f "$TAPMARKER_OUTPUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$TAPMARKER_OUTPUT"
          echo "SOURCE COMPILED; the APK is TEMPORARY-KEY-ONLY and NOT upgradable."
      - name: Fail closed on v1.157 DEX-class and asset preservation
        run: |
          set -euo pipefail
          python3 markertap/tools/check_preserved_features.py "$RUNNER_TEMP/test-only-do-not-install.apk" \
            --report "$RUNNER_TEMP/legacy-required-features.json"
          python3 markertap/tools/audit_v157_apk_parity.py \
            --baseline "$RUNNER_TEMP/baseline/MarkerTap-v1.157-integrated-signed.apk" \
            --candidate "$RUNNER_TEMP/test-only-do-not-install.apk" \
            --report "$RUNNER_TEMP/v157-class-and-assets-parity.json"
      - name: Archive audit reports only (never upload unsafe APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markertap-v157-preservation-reports-not-an-apk
          path: |
            ${{ runner.temp }}/legacy-required-features.json
            ${{ runner.temp }}/v157-class-and-assets-parity.json
          if-no-files-found: warn
          retention-days: 14
