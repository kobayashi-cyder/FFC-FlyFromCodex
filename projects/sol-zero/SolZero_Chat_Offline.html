<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#153e56"><title>Sol-Zero | Chat v0.11</title>
<style>
:root{color-scheme:light;--bg:#f4f8fa;--surface:#fff;--side:#12374d;--side-ink:#e3f1f6;--ink:#152f3e;--sub:#587180;--line:#d5e2e8;--accent:#126e82;--accent-2:#e2f4f6;--user:#dbedf3;--shadow:0 16px 45px #16344324;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
:root[data-theme=dark]{color-scheme:dark;--bg:#101e28;--surface:#192c38;--side:#0d1b25;--side-ink:#dbe8ef;--ink:#e6f2f6;--sub:#a4bcc7;--line:#35505e;--accent:#58c3d2;--accent-2:#194350;--user:#1f4c5a;--shadow:0 16px 45px #0007}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{height:100dvh;background:var(--bg);color:var(--ink);overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.hidden{display:none!important}
#app{display:grid;grid-template-columns:270px minmax(0,1fr);height:100%;max-height:100dvh}
.sidebar{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;min-height:0;padding:16px 13px;gap:11px}
.brand{display:flex;gap:11px;align-items:center;padding:4px 4px 13px;border-bottom:1px solid #ffffff26}.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#2d99b0;color:#fff;font-weight:850;font-size:18px}.brand strong{font-size:18px}.brand small{display:block;font-size:11px;opacity:.78;margin-top:2px}
.side-btn{width:100%;text-align:left;color:var(--side-ink);background:transparent;border:1px solid #ffffff36;border-radius:10px;padding:10px 11px;font-size:13px}.side-btn:hover{background:#ffffff18}.side-actions{display:grid;gap:7px}.searchbox{width:100%;background:#ffffff13;color:#fff;border:1px solid #ffffff38;border-radius:9px;outline:none;padding:10px 11px;font-size:13px}.searchbox::placeholder{color:#c2d5dd}.searchbox:focus{border-color:#8ed9e5}
.section-caption{font-size:11px;letter-spacing:.04em;margin:2px 3px;color:#b4ccd8}.history{min-height:0;flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px}.chat-nav{text-align:left;color:var(--side-ink);border:1px solid transparent;background:transparent;border-radius:9px;padding:10px 11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.chat-nav[aria-current="true"]{background:#ffffff24;border-color:#ffffff32}.chat-nav:hover{background:#ffffff1b}.chat-nav small{display:block;opacity:.65;font-size:10px;margin-top:3px}.side-footer{display:grid;gap:7px;padding-top:10px;border-top:1px solid #ffffff2a}.side-footer .row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}.topbar{background:var(--surface);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;min-height:72px;gap:10px;padding:12px 19px}.topbar h1{font-size:17px;margin:0 0 4px}.topbar p{font-size:11px;color:var(--sub);margin:0}.head-actions{display:flex;gap:7px;align-items:center}.top-btn{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--ink);white-space:nowrap;font-size:13px}.top-btn:hover{background:var(--accent-2)}.status{color:var(--accent);border:1px solid var(--line);background:var(--accent-2);font-weight:700;font-size:11px;border-radius:50px;padding:7px 10px;white-space:nowrap}
.messages{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:0;padding:23px max(22px,calc((100% - 850px)/2));scroll-behavior:smooth}.message{display:flex;gap:10px;align-items:flex-start;margin:19px 0}.message.user{justify-content:flex-end}.avatar{display:grid;place-items:center;border-radius:10px;background:var(--accent-2);color:var(--accent);height:34px;width:34px;flex:0 0 34px;font-weight:800;font-size:13px}.content{max-width:min(720px,87%);min-width:0}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.8;padding:12px 15px;background:var(--surface);border:1px solid var(--line);border-radius:4px 15px 15px 15px;box-shadow:0 2px 8px #102d3810}.message.user .bubble{background:var(--user);border-radius:15px 4px 15px 15px}.meta{display:flex;align-items:center;gap:9px;color:var(--sub);font-size:10px;margin:5px 2px}.message.user .meta{justify-content:flex-end}.copy-btn{color:var(--accent);border:0;background:none;padding:1px 4px;font-size:11px}
.welcome{text-align:center;max-width:590px;margin:8vh auto 35px}.welcome-logo{width:69px;height:69px;border-radius:22px;background:var(--accent-2);color:var(--accent);font-size:25px;font-weight:900;display:grid;place-items:center;margin:0 auto 15px}.welcome h2{font-size:24px;margin:0 0 12px}.welcome p{font-size:14px;line-height:1.9;color:var(--sub);margin:0 auto 21px}.examples{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.example{border:1px solid var(--line);color:var(--ink);background:var(--surface);border-radius:24px;padding:9px 12px;font-size:12px}
.composer-wrap{background:var(--surface);border-top:1px solid var(--line);padding:10px max(15px,calc((100% - 850px)/2)) max(12px,env(safe-area-inset-bottom))}.composer{display:flex;align-items:flex-end;background:var(--surface);gap:7px;border:1px solid #99b6c3;border-radius:14px;padding:7px}.composer:focus-within{outline:2px solid #8ac9d6;outline-offset:1px}.composer textarea{flex:1;min-width:0;min-height:43px;max-height:145px;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px;padding:9px 8px;line-height:1.5}.send{background:#16536b;border:0;color:#fff;min-height:43px;min-width:53px;border-radius:10px;font-size:13px;font-weight:700}.disclaimer{color:var(--sub);font-size:10.5px;text-align:center;margin-top:7px;line-height:1.5}
.scrim{position:fixed;inset:0;background:#0618239e;z-index:50}.panel{position:fixed;z-index:51;top:5%;left:50%;transform:translateX(-50%);max-height:90%;overflow:hidden;width:min(720px,calc(100vw - 26px));border:1px solid var(--line);background:var(--surface);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column}.panel-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.panel-head h2{font-size:18px;margin:0}.panel-body{padding:16px 19px;overflow:auto;flex:1;min-height:0}.panel-foot{padding:12px 19px;border-top:1px solid var(--line);font-size:11px;color:var(--sub)}
.field{margin-bottom:13px}.field label{display:block;color:var(--sub);font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:var(--bg);padding:10px 11px;outline-color:var(--accent)}.field textarea{min-height:91px;resize:vertical}.buttons{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{background:var(--accent-2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12px}.btn.primary{background:#15546d;border-color:#15546d;color:white}.btn.danger{background:#fff0ee;color:#983f2e;border-color:#efb8ae}.muted{color:var(--sub);font-size:12px;line-height:1.7}.listentry{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:var(--bg);overflow-wrap:anywhere}.listentry .entry-main{font-weight:700;font-size:13px;white-space:pre-wrap}.listentry .entry-answer{font-size:12px;white-space:pre-wrap;line-height:1.6;color:var(--sub);margin:7px 0 10px;max-height:110px;overflow:auto}.flex{display:flex;align-items:center;justify-content:space-between;gap:10px}.small-caption{font-size:11px;color:var(--sub)}.mobile-only{display:none}
.toast{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);max-width:90vw;z-index:100;background:#133d52;color:white;border-radius:9px;padding:10px 13px;font-size:12px;box-shadow:var(--shadow)}
@media(max-width:840px){.status{display:none}.topbar{padding:10px 12px}.top-btn{font-size:12px;padding:8px 9px}.topbar p{max-width:260px;line-height:1.4}}
@media(max-width:700px){.head-actions .top-btn{padding:8px 7px;font-size:11px}.topbar h1{font-size:15px}#app{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:flex;position:fixed;z-index:40;inset:0 auto 0 0;width:min(82vw,315px);box-shadow:0 0 0 100vmax #071f3180}.mobile-only{display:inline-flex}.desktop-optional{display:none}.topbar{min-height:66px}.topbar h1{font-size:16px}.topbar p{font-size:10px;max-width:225px}.head-actions{gap:5px}.messages{padding:16px 11px}.message{margin:15px 0}.content{max-width:86%}.bubble{font-size:13px;line-height:1.8;padding:11px 13px}.welcome{margin:6vh auto}.welcome h2{font-size:22px}.welcome p{font-size:13px}.composer-wrap{padding:8px 8px max(10px,env(safe-area-inset-bottom))}.panel{top:3%;max-height:94%;width:calc(100vw - 18px);border-radius:14px}.panel-body{padding:13px}.panel-head{padding:12px 14px}.panel-foot{padding:10px 14px}.disclaimer{font-size:9px}}

@media(max-width:700px){
  .topbar{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:10px 12px;min-height:auto}
  .topbar>div:first-child{display:flex;align-items:baseline;gap:10px;min-width:0}
  .topbar h1{font-size:16px;white-space:nowrap;flex:0 0 auto}
  .topbar p{white-space:nowrap;max-width:none;overflow:hidden;text-overflow:ellipsis}
  .head-actions{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;width:100%;max-width:100%;gap:6px;padding-bottom:3px;scrollbar-width:thin}
  .head-actions .top-btn{flex:0 0 auto;white-space:nowrap}
}

<div id="app">
<aside id="sidebar" class="sidebar" aria-label="会話一覧">
  <div class="brand"><div class="logo">S0</div><div><strong>Sol-Zero</strong><small>from scratch · Chat v0.11</small></div></div>
  <button id="newSidebar" class="side-btn">＋ 新しい会話</button>
  <input id="historySearch" class="searchbox" type="search" placeholder="会話とメッセージを検索" aria-label="会話履歴を検索">
  <div class="section-caption">会話履歴 <span id="chatCount"></span></div>
  <nav class="history" id="history" aria-label="チャット履歴"></nav>
  <div class="side-footer">
    <button id="factorySide" class="side-btn">🧰 WSP回路工房</button><button id="graphSide" class="side-btn">🧠 WSP汎用グラフ</button><button id="induceSide" class="side-btn">🔬 帰納WSP・規則を発見</button><button id="autoSide" class="side-btn">✦ WSP回路を自動設計</button><button id="bulkSide" class="side-btn">⚙ WSP大量回路</button>
    <button id="pinChat" class="side-btn">📌 会話を固定</button>
    <div class="side-actions"><button id="rename" class="side-btn">✎ 会話の名前を変更</button><button id="exportJson" class="side-btn">↓ JSONバックアップ</button><button id="exportMd" class="side-btn">↓ Markdown書き出し</button><button id="importJson" class="side-btn">↑ JSONから復元</button></div>
    <div class="row2"><button id="deleteChat" class="side-btn">現在の会話を削除</button><button id="themeSide" class="side-btn">◐ 配色</button></div>
  </div>
</aside>
<main class="main">
<header class="topbar"><div><h1>Sol-Zero Chat</h1><p>学習済みモデルなし・端末内で実行</p></div><div class="head-actions">
  <span class="status">ローカル v0.11</span>
  <button class="top-btn mobile-only" id="menu" title="会話履歴" aria-label="会話履歴">☰</button>
  <button class="top-btn" id="knowledgeBtn">知識</button><button class="top-btn" id="docsBtn">資料</button><button class="top-btn" id="generatorBtn">生成実験</button><button class="top-btn" id="factoryBtn">回路工房</button><button class="top-btn" id="graphBtn">汎用WSP</button><button class="top-btn" id="induceBtn">帰納WSP</button><button class="top-btn" id="autoBtn">自動設計</button><button class="top-btn desktop-optional" id="bulkBtn">WSP拡張</button><button class="top-btn desktop-optional" id="circuitBtn">回路</button>
  <button class="top-btn" id="newTop" title="新しい会話" aria-label="新しい会話">＋</button>
</div></header>
<section id="messages" class="messages" role="log" aria-label="チャットメッセージ"></section>
<footer class="composer-wrap"><form id="chatForm" class="composer"><textarea id="input" rows="1" maxlength="3000" placeholder="質問、/intent、/help、計算など…" aria-label="メッセージを入力"></textarea><button id="send" class="send" type="submit">送信</button></form><div class="disclaimer">ルール・保存知識・WSP回路・ゼロから学習した6分類器を使用。汎用的な言語推論は未搭載。</div></footer>
</main></div>
<div id="scrim" class="scrim hidden"></div>
<section id="panel" class="panel hidden" role="dialog" aria-modal="true" aria-labelledby="panelTitle"><header class="panel-head"><h2 id="panelTitle">設定</h2><button id="closePanel" class="top-btn" aria-label="閉じる">× 閉じる</button></header><div id="panelBody" class="panel-body"></div><footer id="panelFoot" class="panel-foot">すべて端末内で処理します。</footer></section>
<input id="jsonPicker" type="file" accept=".json,application/json" class="hidden">
<input id="docPicker" type="file" accept=".txt,.md,text/plain,text/markdown" multiple class="hidden">
<div id="toast" class="toast hidden" role="status"></div>

const ENGINE_VERSION = '0.11.0';
const FEATURE_SETS = Object.freeze({
  greeting: ['こんにちは','こんばんは','おはよう','はじめまして','やあ','hello','hi'],
  identity: ['あなたは','君は','誰ですか','名前は','sol-zero','solzero','何者'],
  help: ['使い方','ヘルプ','できること','何ができる','/help','機能'],
  gratitude: ['ありがとう','助かっ','感謝','thanks'],
  code: ['コード','プログラム','python','javascript','コーディング'],
  reasoning: ['どうして','なぜ','理由','考えて','推論'],
  multimodal: ['画像','写真','動画','音声'],
  casual: ['雑談','会話','話そう','よろしく'],
});
const INTENTS = Object.freeze(Object.keys(FEATURE_SETS));
function normalized(s) { return String(s).normalize('NFKC').trim().toLowerCase(); }
function questionKey(s) { return normalized(s).replace(/[\s\p{P}\p{S}]+/gu, ''); }
function boundedText(s, limit) { return typeof s === 'string' ? s.trim().slice(0, limit) : ''; }

// Author-programmed small neural-style linear router, never pretrained.
class WeightRouter {
  constructor() {
    this.intents = [...INTENTS]; this.features = [...INTENTS];
    this.weights = this.intents.map((_,i) => this.features.map((__,j)=> i === j ? 4 : 0));
    this.history = [];
  }
  featuresOf(text) {
    const x = normalized(text);
    return this.features.map(k => Number(FEATURE_SETS[k].some(word =>
      word === 'hi' ? /\bhi\b/.test(x) : x.includes(word))));
  }
  predict(text) {
    const f = this.featuresOf(text);
    const scores = this.weights.map(row => row.reduce((s,w,j)=> s + w*f[j], 0));
    const max = Math.max(...scores);
    return {intent:max<=0?'unknown':this.intents[scores.indexOf(max)],scores,features:f};
  }
  edit(intent,feature,value) {
    const i = this.intents.indexOf(intent),j = this.features.indexOf(feature);
    if (i<0 || j<0 || !Number.isFinite(value) || Math.abs(value)>100) throw Error('Invalid WSP edit');
    const before=this.weights[i][j]; this.weights[i][j]=value;
    const patch={intent,feature,before,after:value}; this.history.push(patch);
    if(this.history.length>64)this.history.shift();
    return patch;
  }
  rollback() {
    const p=this.history.pop(); if(!p) return false;
    this.weights[this.intents.indexOf(p.intent)][this.features.indexOf(p.feature)] = p.before;
    return true;
  }
  snapshot() { return { weights:this.weights.map(r=>[...r]), history:this.history.map(p=>({...p})) }; }
  restore(snapshot) {
    if (!snapshot || !Array.isArray(snapshot.weights) || snapshot.weights.length!==this.intents.length ||
       !snapshot.weights.every(r=>Array.isArray(r) && r.length===this.features.length &&
         r.every(n=>typeof n==='number' && Number.isFinite(n) && Math.abs(n)<=100))) return false;
    this.weights=snapshot.weights.map(r=>[...r]);
    // imported patch history cannot be trusted to represent the current weights
    const patches=Array.isArray(snapshot.history) ? snapshot.history : [];
    let valid=patches.length<=64;
    const trial=this.weights.map(r=>[...r]);
    for(let k=patches.length-1;k>=0 && valid;k--){
      const p=patches[k],i=this.intents.indexOf(p?.intent),j=this.features.indexOf(p?.feature);
      if(i<0||j<0||!Number.isFinite(p?.before)||!Number.isFinite(p?.after)||
         Math.abs(p.before)>100||Math.abs(p.after)>100||trial[i][j]!==p.after){valid=false;break;}
      trial[i][j]=p.before;
    }
    this.history=valid?patches.map(p=>({...p})):[];
    return true;
  }
}

// Expression parser without eval, Function or JavaScript interpretation.
function calculate(input) {
  let s=normalized(input).replace(/[×x]/g,'*').replace(/÷/g,'/');
  s=s.replace(/^(?:計算(?:して|してください)?|calculate)\s*[：:]?\s*/u,'').trim();
  s=s.replace(/(?:は)?[？?]\s*$/u,'').trim();
  if (!s || s.length>120 || !/^[0-9.()\-+*/%\s]+$/.test(s)) return null;
  const parts=s.match(/(?:\d+\.?\d*|\.\d+)|[()+*/%-]/g);
  if(!parts || parts.length>100 || parts.join('').length!==s.replace(/\s/g,'').length) return null;
  let pos=0,depth=0;
  function expression() {
    let v=term();
    while(parts[pos]==='+'||parts[pos]==='-') { const op=parts[pos++],rhs=term();v=op==='+'?v+rhs:v-rhs; }
    return v;
  }
  function term() {
    let v=unary();
    while(parts[pos]==='*'||parts[pos]==='/'||parts[pos]==='%') {
      const op=parts[pos++],rhs=unary();if((op==='/'||op==='%')&&rhs===0)throw Error('zero division');
      v=op==='*'?v*rhs:op==='/'?v/rhs:v%rhs;
    }return v;
  }
  function unary() {
    if(++depth>48) throw Error('too deep');
    try {
      if(parts[pos]==='+'){pos++;return unary();}
      if(parts[pos]==='-'){pos++;return -unary();}
      if(parts[pos]==='('){pos++;const v=expression();if(parts[pos++]!==')')throw Error('parentheses');return v;}
      const token=parts[pos++];if(!token || !/^(?:\d+\.?\d*|\.\d+)$/.test(token))throw Error('number');
      return Number(token);
    }finally{depth--;}
  }
  try {
    const v=expression();
    if(pos!==parts.length || !Number.isFinite(v) || Math.abs(v)>1e15) return {error:'計算式の範囲外です。'};
    return {value:Number(v.toPrecision(13)).toString()};
  } catch(err) {return {error:err.message==='zero division'?'ゼロでは割れません。':'計算式を確認してください。'};}
}

// String similarity, not a learned semantic encoder. Abstains at low confidence.
function similarity(a,b) {
  const x=questionKey(a), y=questionKey(b);
  if(!x || !y) return 0;
  if(x===y) return 1;
  if(Math.min(x.length,y.length)<5) return 0;
  const chunks = s => { const m=new Map();for(let i=0;i<s.length-1;i++){const t=s.slice(i,i+2);m.set(t,(m.get(t)||0)+1);}return m; };
  const aa=chunks(x), bb=chunks(y);let common=0;
  for(const [k,n] of aa) common+=Math.min(n,bb.get(k)||0);
  return (2*common)/((x.length-1)+(y.length-1));
}

function findLesson(query, collection) {
  if(!Array.isArray(collection)) return null;
  const lessons=collection.filter(l=>l && typeof l.q==='string' && typeof l.a==='string');
  const exact=lessons.find(l=>questionKey(l.q)===questionKey(query));
  if(exact) return {lesson:exact,score:1};
  let best=null;
  for(const lesson of lessons) {
    const score=similarity(query,lesson.q);
    if(!best || score>best.score) best={lesson,score};
  }
  return best;
}

function saveLesson(collection, q, a, max=200) {
  if(!Array.isArray(collection)) throw Error('Knowledge collection missing');
  q=boundedText(q,120);a=boundedText(a,1500);
  if(!q || !a) throw Error('質問と回答を入力してください。');
  const found=collection.find(l=>questionKey(l.q)===questionKey(q));
  if(found){ found.q=q;found.a=a;return 'updated'; }
  collection.push({q,a}); if(collection.length>max) collection.shift();return 'added';
}

function formatTasks(tasks) {
  if(!tasks.length) return 'タスクはありません。「/todo タスク内容」で追加できます。';
  return `タスク（${tasks.filter(t=>t.done).length}/${tasks.length}件完了）：\n`+
    tasks.map((t,i)=>`${i+1}. ${t.done?'☑':'☐'} ${t.text}`).join('\n');
}
function searchDocuments(query, documents) {
  const key=normalized(query);if(!key || key.length>80) return '検索語は1〜80文字で入力してください。';
  const matches=[];
  for(const doc of (documents||[])) {
    if(!doc || typeof doc.text!=='string') continue;
    const lines=doc.text.split(/\r?\n/);
    for(let i=0;i<lines.length;i++) {
      const line=lines[i].trim();
      if(normalized(line).includes(key)) matches.push({title:doc.title||'無題',line:i+1,text:line.slice(0,240)});
      if(matches.length>=6) break;
    }
    if(matches.length>=6) break;
  }
  return matches.length ? `資料中の一致箇所（文字列検索・最大6件）：\n${matches.map(m=>`・${m.title} ${m.line}行目：${m.text}`).join('\n')}` :
    `登録資料に「${query}」の文字列一致はありません。意味検索ではありません。`;
}

// Citation-oriented extractive search. Never fabricates answers beyond stored lines.
function retrieveEvidence(query, documents, limit=4) {
  const q=questionKey(query);if(!q||q.length>100)return [];
  const terms=[...new Set(normalized(query).split(/[\s、，,。？！?:：]+/u).map(questionKey).filter(t=>t.length>=2))];
  const queryBigrams=new Set();for(let i=0;i<q.length-1;i++)queryBigrams.add(q.slice(i,i+2));
  const found=[];
  for(const doc of documents||[]){
    if(!doc || typeof doc.text!=='string')continue;
    const lines=doc.text.split(/\r?\n/);
    lines.forEach((line,i)=>{
      if(!line.trim())return;
      const key=questionKey(line);let overlap=0;
      for(const gram of queryBigrams)if(key.includes(gram))overlap++;
      const exact=terms.filter(t=>key.includes(t)).length;
      const score=3*exact+overlap/Math.max(2,queryBigrams.size);
      if((exact || overlap>=2) && score>=.35)found.push({title:doc.title,line:i+1,text:line.trim().slice(0,240),score});
    });
  }
  return found.sort((a,b)=>b.score-a.score||a.title.localeCompare(b.title)||a.line-b.line).slice(0,limit);
}

/* Tiny scratch-trained character-to-character softmax predictor.

class ScratchBigram {
  constructor(){this.vocab=[];this.weights=[];this.steps=0;this.events=[];this.version=1;}
  index(){return new Map(this.vocab.map((x,i)=>[x,i]));}
  get size(){return this.vocab.length;}
  expand(text){
    const unique=[...new Set([...text])];
    const newChars=unique.filter(ch=>!this.vocab.includes(ch));
    if(this.vocab.length+newChars.length>96)throw Error('使用文字が96種類を超えました。短い資料で試してください。');

    const before=this.evaluate(text);

    if(!content || content.length>100000 || db.documents.reduce((s,d)=>s+d.text.length,0)+content.length>MAX_DOC_CHARS){skipped++;continue;}
    db.documents.push({id:id(),title:file.name.slice(0,100),text:content,added:new Date().toISOString()});added++;
  }
  if(added){save();renderDocuments();}
  notify(`資料追加：${added}件、スキップ：${skipped}件`);
}

    el('button',{class:'btn primary',text:'回路生成',onClick:()=>{try{const r=fresh();preview.textContent=`${r.summary}\n${r.graph.inputs.length}入力・${r.stats.nodes}ノード・${r.stats.weights}重み（0から直接コンパイル）\n保存容量は選択した回路だけで増えます。`;tests.textContent='仕様照合の試験を待っています。';}catch(e){staged=null;preview.textContent='生成拒否：'+e.message;}}}),
    el('button',{class:'btn',text:'任意入力で実行',onClick:()=>{try{const r=fresh(),input=values.input.value.trim().split(/[,，\s]+/).map(Number);if(input.some(x=>!Number.isFinite(x)))throw Error('有限な数値が必要です');const output=new WSPGraph(r.graph).run(input).outputs;preview.textContent='実行結果：'+JSON.stringify(output)+'\n予測器ではなく仕様から生成した重み回路の出力です。';}catch(e){preview.textContent='実行拒否：'+e.message;}}}),
    el('button',{class:'btn primary',text:'仕様照合テスト',onClick:()=>{try{const r=fresh(),report=verifyFactory(r);tests.textContent=`${r.label} #${r.variant}：${report.correct}/${report.total} 件正解。${r.exhaustive?'全入力を照合':'有限個の数値例を照合'}。\n※試験の正解は別計算した仕様値です。未知問題への汎化試験ではありません。`;}
      catch(e){tests.textContent='試験拒否：'+e.message;}}}),
    el('button',{class:'btn primary',text:'合格回路をチャットへ適用',onClick:()=>{try{const r=fresh(),report=verifyFactory(r);if(report.correct!==report.total)throw Error('仕様試験に不合格');engine.graph.install(r.graph,true);save();tests.textContent=`${r.label} #${r.variant} を現在の汎用WSPグラフへ適用しました。\n/graph ${r.graph.inputs.map(()=>1).join(',')} で実行できます。汎用WSP画面からロールバックできます。`;}catch(e){tests.textContent='適用拒否：'+e.message;}}}),
    el('button',{class:'btn',text:'JSONを書き出す',onClick:()=>{try{const r=fresh();download(JSON.stringify(r.graph,null,2),`solzero_${r.family}_${r.variant}.json`,'application/json;charset=utf-8');}catch(e){preview.textContent=e.message;}}})
  ),preview,tests);
  root.append(el('h3',{text:'大量生成を実測・検証（逐次生成、保存しない）'}));
  const count=field('一度に検証する回路数（1〜512）','number');count.input.value='128';count.input.min='1';count.input.max='512';
  const bulkLog=el('div',{class:'listentry',text:'各回路を実際にコンパイルして入力値を検証します。結果は常駐させません。'});
  root.append(count.wrapper,el('div',{class:'buttons'},el('button',{class:'btn primary',text:'指定範囲の大量回路を実生成・テスト',onClick:()=>{
    try{const report=auditFactory(selector.value,Number(idx.input.value),Number(count.input.value));bulkLog.textContent=`${report.family} #${report.start}〜${report.start+report.count-1}\n生成・検証：${report.passed}/${report.count} 回路合格／${report.verifiedCases} 入力ケース／仮想重み総数 ${report.virtualWeightCount.toLocaleString('ja-JP')}\n${report.failed?'失敗例: '+JSON.stringify(report.errors):'失敗なし'}\n※検査後、回路は破棄。未検証の設定番号は合格扱いしません。`;
    }catch(e){bulkLog.textContent='一括検証を拒否：'+e.message;}
  }})),bulkLog);
  root.append(el('h3',{text:'異種WSP回路の直列合成'}),el('p',{class:'muted',text:'2〜8段の回路の出力を次の入力に接続します。入出力の数が合わない場合は採用しません。例：一次関数 → ReLU → Sigmoid。'}));
  const pipeline=field('合成する回路の指定（JSON配列）','textarea');pipeline.input.style.minHeight='110px';
  pipeline.input.value=JSON.stringify([{family:'affine1',variant:3},{family:'relu_shift1',variant:4},{family:'sigmoid1',variant:8}],null,2);
  const pipelineLog=el('div',{class:'listentry',text:'合成回路はまだ生成していません。'});let compound=null;
  root.append(pipeline.wrapper,el('div',{class:'buttons'},
    el('button',{class:'btn',text:'合成回路を検証',onClick:()=>{try{compound=composeFactories(JSON.parse(pipeline.input.value));pipelineLog.textContent=`直列${compound.stages.length}段：${compound.stats.nodes}ノード／${compound.stats.weights}重み。\n検証：${compound.verification.correct}/${compound.verification.total}（${compound.verified?'合格':'不合格'}）。`; }catch(e){compound=null;pipelineLog.textContent='合成拒否：'+e.message;}}}),
    el('button',{class:'btn primary',text:'合格した合成回路を適用',onClick:()=>{try{compound=composeFactories(JSON.parse(pipeline.input.value));if(!compound.verified)throw Error('仕様照合試験に不合格');engine.graph.install(compound.graph,true);save();pipelineLog.textContent=`異種回路 ${compound.stages.length}段をチャットWSPへ適用しました。/graph に入力して利用できます。`; }catch(e){pipelineLog.textContent='採用拒否：'+e.message;}}})
  ),pipelineLog);
}

function renderAutoDesign(){
  panelIntro('WSP 自動設計・独立検証','入力例から特徴量と数値回路を自動合成します。学習済みLLMは使わず、検証に不合格なら適用できません。');
  const root=byId('panelBody');root.replaceChildren();
  root.append(el('p',{class:'muted',text:'「訓練例」に入力と正解を複数記入します。Sol-Zeroが共有する文字列の特徴を発見してWSP回路を生成し、別の「独立検証例」で正答率と誤発火を評価します。目標文そのものを意味理解することはできません。'}));
  const specText=field('問題の仕様（JSON：train=構築用、validation=独立評価用）','textarea');
  specText.input.style.minHeight='240px';specText.input.value=JSON.stringify(AUTO_DEMO,null,2);
  const result=el('div',{class:'listentry',text:'最初に「自動設計と独立検証」を押してください。'});
  let lastReport=null,lastText=null;
  const overview=()=>{const a=db.autoAudit;if(!a)return 'まだ採用履歴はありません。';return `直近の判定：${a.decision} / 回路 ${a.rules}件 / 検証 ${a.validCorrect}/${a.validTotal} / 目標：${a.goal}`;};
  root.append(el('div',{class:'listentry',text:overview()}),specText.wrapper);
  const action=el('div',{class:'buttons'},
    el('button',{class:'btn',text:'サンプルの問題を読み込む',onClick:()=>{specText.input.value=JSON.stringify(AUTO_DEMO,null,2);lastReport=null;result.textContent='サンプルを編集してから設計してください。';}}),
    el('button',{class:'btn primary',text:'① 自動設計と独立検証',onClick:()=>{
      try{
        if(specText.input.value.length>120000)throw Error('仕様入力は12万文字以内です。');
        const input=JSON.parse(specText.input.value),spec=validateTask(input);
        // A read-only evaluation of the existing circuit. Not used to design the new circuit.
        const baseline=evaluate(engine.bulk,spec.validation);const report=designAndVerify(input);
        lastReport=report;lastText=specText.input.value;
        const errors=report.validation.errors.slice(0,5).map(e=>`・「${e.input}」 期待:${e.expected??'回答なし'} / 実際:${e.actual??'回答なし'}`).join('\n');
        result.textContent=`${report.accepted?'合格（採用可能）':'不合格（採用不可）'}\n目標：${report.goal}\n生成回路：${report.rules.length}ルール、${report.stats.neurons}ニューロン、${report.stats.edges}数値接続\n訓練：${report.training.correct}/${report.training.total} / 独立検証：${report.validation.correct}/${report.validation.total} (${(report.validation.accuracy*100).toFixed(1)}%)\n現行回路：${baseline.correct}/${baseline.total} / 新規誤発火：${report.validation.falsePositive}件\n回路の例：${report.rules.slice(0,8).map(r=>`${r.all.join('&')} → ${r.response}`).join('、')||'なし'}\n${report.reasons.join(' ')}\n${errors}`;
        db.autoAudit={date:new Date().toISOString(),decision:report.accepted?'合格・未適用':'不合格',goal:report.goal.slice(0,180),rules:report.rules.length,validCorrect:report.validation.correct,validTotal:report.validation.total};engine.autoAudit=db.autoAudit;save();
      }catch(e){lastReport=null;lastText=null;result.textContent='設計拒否：'+e.message;}
    }}),
    el('button',{class:'btn primary',text:'② 合格した回路を採用',onClick:()=>{
      if(!lastReport?.accepted || lastText!==specText.input.value){result.textContent='採用不可：最新の仕様に対する合格検証が必要です。';return;}
      if(!confirm(`合格した${lastReport.rules.length}ルールで現在のWSP一括回路を置き換えますか？直前の変更はWSP拡張で戻せます。`))return;
      try{const x=promoteVerified(lastReport,engine.bulk);db.autoAudit={date:new Date().toISOString(),decision:'採用',goal:lastReport.goal.slice(0,180),rules:x.rules,validCorrect:lastReport.validation.correct,validTotal:lastReport.validation.total};engine.autoAudit=db.autoAudit;const ok=save();result.textContent=`${ok?'採用しました':'回路は動作中ですが保存に失敗しました'}：${x.rules}ルール、${x.neurons}ニューロン、${x.edges}接続\nチャットで「/wsp trace 計算して」を試せます。`;lastReport=null;lastText=null;}
      catch(e){result.textContent='採用失敗：'+e.message;}
    }}),
    el('button',{class:'btn',text:'直前のルール採用を戻す',onClick:()=>{
      if(!engine.bulk.restorePreviousRules())return result.textContent='戻せる一括変更はありません。';
      save();result.textContent='WSPルールを直前の構成に戻しました。';lastReport=null;
    }})
  );
  root.append(action,el('h3',{text:'設計・試験結果'}),result,el('h3',{text:'工程から状態遷移回路を自動作成'}),
    el('p',{class:'muted',text:'工程の名前と内容を入力すると、開始・成功・失敗・中止イベントを備えたWSP状態機械を生成します。行動文を返すだけでOS操作はしません。'}));
  const flowInput=field('工程JSON（goalとsteps）','textarea');flowInput.input.style.minHeight='155px';flowInput.input.value=JSON.stringify(AUTO_FLOW_DEMO,null,2);
  const flowResult=el('div',{class:'listentry',text:'工程を入力し「候補を作成」を押してください。'});
  let candidateFlow=null,candidateText=null;
  root.append(flowInput.wrapper,el('div',{class:'buttons'},
    el('button',{class:'btn',text:'工程サンプルを読み込む',onClick:()=>{flowInput.input.value=JSON.stringify(AUTO_FLOW_DEMO,null,2);candidateFlow=null;flowResult.textContent='サンプルを読み込みました。';}}),
    el('button',{class:'btn primary',text:'① 遷移回路候補を作成',onClick:()=>{
      try{
        if(flowInput.input.value.length>30000)throw Error('入力が長すぎます。');
        const p=planFlow(JSON.parse(flowInput.input.value)),probe=new WSPFlow(),st=probe.compile(p);
        candidateFlow=p;candidateText=flowInput.input.value;
        flowResult.textContent=`生成候補：${st.states}状態、${st.transitions}遷移、${st.edges}数値接続\n開始：待機 → ${p.transitions[0].to}\n未適用。`;
      }catch(e){candidateFlow=null;flowResult.textContent='生成拒否：'+e.message;}
    }}),
    el('button',{class:'btn primary',text:'② 状態機械へ採用',onClick:()=>{
      if(!candidateFlow||candidateText!==flowInput.input.value)return flowResult.textContent='最新の入力で候補を生成してください。';
      if(!confirm('現在の状態遷移回路と実行履歴を新しい回路へ置き換えますか？'))return;
      try{const old=engine.flow.snapshot(),st=engine.flow.compile(candidateFlow);db.flowPrevious=old;const ok=save();flowResult.textContent=`${ok?'採用しました':'保存に失敗しました'}：${st.states}状態、${st.edges}数値接続。/flow event 開始 で動作を試せます。`;candidateFlow=null;}
      catch(e){flowResult.textContent='拒否：'+e.message;}
    }}),
    el('button',{class:'btn',text:'以前の状態機械に戻す',onClick:()=>{
      if(!db.flowPrevious||!engine.flow.restore(db.flowPrevious))return flowResult.textContent='復元可能な旧状態機械がありません。';
      db.flowPrevious=null;save();flowResult.textContent='以前の状態機械へ戻しました。';
    }})
  ),flowResult);
}

function appendFlowControls(root){
  root.append(el('h3',{text:'WSP状態遷移回路（イベント式）'}),el('p',{class:'muted',text:'状態とイベントの2入力ReLU回路で遷移を決めます。ここでは行動案の文字を返すだけで、端末や外部アプリを勝手に操作しません。'}));
  const current=el('div',{class:'listentry'}),result=el('div',{class:'listentry'});
  const refresh=()=>{const s=engine.flow.stats();current.textContent=`状態：${engine.flow.state} / ${s.states}状態 / ${s.events}イベント / ${s.transitions}遷移 / ${s.edges}重み接続`;};
  refresh();
  const js=field('状態遷移のJSON','textarea','{"initial":"待機","transitions":[]}');js.input.style.minHeight='100px';js.input.value=JSON.stringify(engine.flow.snapshot(),null,2);
  const event=field('遷移イベント名','text','例：開始');event.input.value='開始';
  root.append(current,js.wrapper,event.wrapper,el('div',{class:'buttons'},
    el('button',{class:'btn',text:'状態機械サンプルを表示',onClick:()=>{js.input.value=JSON.stringify(FLOW_DEMO,null,2);}}),
    el('button',{class:'btn primary',text:'遷移回路をコンパイル',onClick:()=>{
      try{const spec=JSON.parse(js.input.value);engine.flow.compile(spec);save();refresh();result.textContent='数値状態遷移回路を生成しました。';}
      catch(e){result.textContent='拒否：'+e.message;}
    }}),
    el('button',{class:'btn',text:'イベントを実行（文字だけ）',onClick:()=>{
      const r=engine.flow.step(event.input.value);if(r.matched){save();result.textContent=`${r.before} → ${r.state} （ニューロン${r.neuron}）\n行動案：${r.action}`;}else result.textContent=r.error;
      refresh();
    }}),
    el('button',{class:'btn',text:'前の状態へ戻す',onClick:()=>{
      result.textContent=engine.flow.rewind()?'状態を1つ戻しました。':'戻せません。';save();refresh();
    }})
  ),result);
}


function renderInduction(){
  panelIntro('帰納WSP：数値例から回路を発見','例だけから候補を決め、未使用評価は採用の可否だけに使います。汎用知能ではありません。');
  const root=byId('panelBody');root.replaceChildren();
  root.append(el('p',{class:'muted',text:'1〜3入力の算術・比較・非線形関数や、入力の線形結合を少数の例から推定します。訓練と検証は入力重複禁止。規則が曖昧なら追加の訓練例を求めます。合格しても一般推論の能力を意味しません。'}));
  const spec=field('訓練例と未使用評価例（JSON形式）','textarea');spec.input.style.minHeight='250px';spec.input.value=JSON.stringify(INDUCTION_DEMO,null,2);
  const sample=field('現在の回路に与える入力（例 2,3）','text');sample.input.value='2,3';
  const output=el('div',{class:'listentry',text:'まず「候補回路を合成して検証」を押してください。'});
  let pending=null;
  root.append(spec.wrapper,sample.wrapper,el('div',{class:'buttons'},
    el('button',{class:'btn',text:'サンプルを表示',onClick:()=>{spec.input.value=JSON.stringify(INDUCTION_DEMO,null,2);pending=null;output.textContent='新しい例を読み込みました。まだ回路には適用していません。';}}),
    el('button',{class:'btn primary',text:'① 候補回路を合成して独立検証',onClick:()=>{
      try{const r=induceAndVerify(JSON.parse(spec.input.value));pending=r.accepted?r:null;
        output.textContent=`判定：${r.status}\n${r.reason}\n訓練 ${r.training.correct}/${r.training.total}・未使用評価 ${r.validation.correct}/${r.validation.total}\n合格候補数 ${r.candidates}・選択 ${r.chosen||'なし'}・重み ${r.weights}個`+
          (r.ambiguity?'\n追加例の候補：'+JSON.stringify(r.ambiguity):'')+
          '\n※実証対象は表現可能な少数の数値関数に限定されます。';
      }catch(e){pending=null;output.textContent='回路合成拒否：'+e.message;}
    }}),
    el('button',{class:'btn primary',text:'② 合格回路だけ採用',onClick:()=>{
      try{if(!pending)throw Error('検証済みの候補がありません');
        const result=promoteInduction(pending,engine.graph);pending=null;
        const saved=save();
        output.textContent=`回路を採用しました。${result.weights}個の重み・${result.nodes}ノード。\n${saved?'端末へ保存済み。':'ブラウザ保存失敗。バックアップしてください。'}\n/induce 2,3 でチャットから実行できます。`;
      }catch(e){output.textContent='採用拒否：'+e.message;}
    }}),
    el('button',{class:'btn',text:'現在の回路を実行',onClick:()=>{
      try{const values=sample.input.value.split(/[,，\s]+/).map(Number);const r=engine.graph.run(values);output.textContent='現在の回路出力：'+JSON.stringify(r.outputs)+'\n中間値：'+JSON.stringify(r.values).slice(0,500);}
      catch(e){output.textContent='実行拒否：'+e.message;}
    }}),
    el('button',{class:'btn',text:'採用前の回路へ戻す',onClick:()=>{
      pending=null;
      output.textContent=engine.graph.rollback()?'前の回路へ復元しました。':'復元する履歴はありません。';save();
    }}),
    el('button',{class:'btn',text:'現在の回路JSONを書き出す',onClick:()=>download(JSON.stringify(engine.graph.snapshot(),null,2),'solzero_induced_wsp.json','application/json;charset=utf-8')})
  ),output);
}
