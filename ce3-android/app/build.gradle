plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.ffc.ce3'
    compileSdk 34

    defaultConfig {
        applicationId "dev.ffc.ce3"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "0.7.0"
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    lint {
        abortOnError true
        disable 'OldTargetApi'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
