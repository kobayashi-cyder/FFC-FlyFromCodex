name: MarkerTap v1.130 signed crash-fix APK
on:
  push:
    branches: ["markertap/crash-v1.130"]
    paths:
      - ".github/workflows/markertap-v1130-crashfix.yml"
      - "markertap/v1.130-crashfix/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: markertap-v1130-crashfix
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build, test, sign and publish v1.130
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 markertap/v1.130-crashfix/build_ci.py
      - name: Archive build logs and verified APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MarkerTap-v1.130-crashfix
          path: crash-build-results/
          if-no-files-found: warn
          retention-days: 30
