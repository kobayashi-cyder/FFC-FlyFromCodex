name: Sol-Zero Android offline APK lab

on:
  push:
    branches: [main, 'feature/sol-zero-*']
    paths:
      - 'projects/sol-zero/android/**'
      - 'projects/sol-zero/SolZero_Chat_Offline.html'
      - '.github/workflows/sol-zero-android.yml'
  pull_request:
    paths:
      - 'projects/sol-zero/android/**'
      - 'projects/sol-zero/SolZero_Chat_Offline.html'
      - '.github/workflows/sol-zero-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android 35 platform and tools
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Android unit tests and signed debug APK
        run: gradle --no-daemon --stacktrace -p projects/sol-zero/android :app:testDebugUnitTest :app:assembleDebug
      - name: Validate signature, package and bundled HTML
        shell: bash
        run: |
          set -euo pipefail
          APK=projects/sol-zero/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='jp.solzero.offline'"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo 'Unexpected INTERNET permission'
            exit 1
          fi
          unzip -p "$APK" assets/index.html | sha256sum > /tmp/embedded.sha256
          sha256sum projects/sol-zero/SolZero_Chat_Offline.html > /tmp/original.sha256
          diff <(cut -d' ' -f1 /tmp/embedded.sha256) <(cut -d' ' -f1 /tmp/original.sha256)
          sha256sum "$APK"
          echo 'PASS: offline HTML bundled byte-for-byte; no Internet permission; debug APK signed'
      - uses: actions/upload-artifact@v4
        with:
          name: SolZero-v016-Android-offline-debug-signed-APK
          path: projects/sol-zero/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  emulator-smoke:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: SolZero-v016-Android-offline-debug-signed-APK
          path: android-apk
      - name: Install WebView debug test driver
        run: python -m pip install --disable-pip-version-check websocket-client==1.8.0
      - name: Boot Android 15 and test real offline app behavior
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            adb install -r android-apk/app-debug.apk
            adb shell am start -W -n jp.solzero.offline/.MainActivity
            sleep 8
            PID="$(adb shell pidof jp.solzero.offline | tr -d '\r')"
            test -n "$PID"
            adb forward tcp:9222 "localabstract:webview_devtools_remote_$PID"
            python projects/sol-zero/android/tests/emulator_smoke.py
            adb shell ls /sdcard/Download/SolZero/ | grep -F 'solzero_v012_backup.json'
            adb logcat -d > /tmp/solzero-android-logcat.txt
            if grep -A8 'FATAL EXCEPTION' /tmp/solzero-android-logcat.txt | grep -F 'jp.solzero.offline'; then
              echo 'Sol-Zero process crashed'
              exit 1
            fi
            adb shell screencap -p /sdcard/solzero-android.png
            adb pull /sdcard/solzero-android.png /tmp/solzero-android.png
            echo 'PASS: Android 15 offline WebView boot, chat, CSV task, PNG, native Downloads'

  publish-lab-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-apk, emulator-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SolZero-v016-Android-offline-debug-signed-APK
          path: android-apk
      - name: Publish immutable experimental APK with SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=sol-zero-v016-offline-lab
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists; preserving its original signing identity."
            exit 0
          fi
          mv android-apk/app-debug.apk android-apk/SolZero-v016-Android-offline-debug-signed.apk
          (cd android-apk && sha256sum SolZero-v016-Android-offline-debug-signed.apk > SHA256SUMS.txt)
          gh release create "$TAG" \
            android-apk/SolZero-v016-Android-offline-debug-signed.apk \
            android-apk/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "Sol-Zero v0.16 Android Offline Lab (debug signed)" \
            --notes "Verified Android offline lab APK. Contains Sol-Zero v0.15 features. No INTERNET permission. CI checks JUnit, APK signing, 16KB alignment, identical offline HTML and Android 15 emulator UI + downloads. Debug signature is not stable across builds: back up and uninstall before future versions if certificates differ. Android 17 physical-device test and AGI are NOT claimed."
