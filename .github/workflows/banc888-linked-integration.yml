name: BANC888 Linked Emulator Test

on:
  push:
    branches:
      - "banc888-apk-*"
    paths:
      - "app/**"
      - ".github/workflows/banc888-linked-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linked-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Configure virtual microphone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --check || pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_mic_sink sink_properties=device.description=CI_Microphone
          pactl set-default-source ci_mic_sink.monitor
          python3 - <<'PY'
          import math, struct, wave
          rate = 16000
          seconds = 20
          amp = 12000
          with wave.open('/tmp/ci-mic-tone.wav', 'wb') as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(rate)
              frames = bytearray()
              for i in range(rate * seconds):
                  v = int(amp * math.sin(2 * math.pi * 440 * i / rate))
                  frames += struct.pack('<h', v)
              w.writeframes(frames)
          PY
          pactl info
          pactl list short sources

      - name: Real linked Android/WebView + audio-path test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: |
            (while true; do paplay --device=ci_mic_sink /tmp/ci-mic-tone.wav; done) >/tmp/ci-mic-play.log 2>&1 &
            MIC_PID=$!
            sleep 2
            gradle --no-daemon connectedDebugAndroidTest
            STATUS=$?
            kill $MIC_PID || true
            exit $STATUS
