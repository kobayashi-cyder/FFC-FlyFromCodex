name: BANC888 Linked Emulator Test

on:
  push:
    branches:
      - "banc888-apk-*"
    paths:
      - "app/**"
      - ".github/workflows/banc888-linked-integration.yml"
      - ".github/scripts/banc888-voice-ci.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linked-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build app and test APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Configure virtual microphone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pulseaudio pulseaudio-utils espeak-ng libasound2-plugins alsa-utils
          pulseaudio --check || pulseaudio --start --exit-idle-time=-1
          PULSE_SOCKET="$(pactl info | sed -n 's/^Server String: //p')"
          test -n "$PULSE_SOCKET"
          case "$PULSE_SOCKET" in
            unix:*) PULSE_SERVER_VALUE="$PULSE_SOCKET" ;;
            /*) PULSE_SERVER_VALUE="unix:$PULSE_SOCKET" ;;
            *) PULSE_SERVER_VALUE="$PULSE_SOCKET" ;;
          esac
          echo "PULSE_SERVER=$PULSE_SERVER_VALUE" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/$(id -u)}" >> "$GITHUB_ENV"
          printf '%s\n' \
            'pcm.!default {' \
            '  type pulse' \
            '}' \
            'ctl.!default {' \
            '  type pulse' \
            '}' > "$HOME/.asoundrc"
          echo "QEMU_AUDIO_DRV=pa" >> "$GITHUB_ENV"
          pactl load-module module-null-sink sink_name=ci_mic_sink sink_properties=device.description=CI_Microphone
          pactl set-default-source ci_mic_sink.monitor
          espeak-ng -v ja -s 125 -a 180 -w /tmp/ci-mic-speech.wav "こんにちは。これは おんせい てすと です。"
          test -s /tmp/ci-mic-speech.wav
          pactl info
          pactl list short sources
          aplay -L | head -40

      - name: Real linked Android/WebView + audio-path test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -allow-host-audio
          script: bash .github/scripts/banc888-voice-ci.sh
