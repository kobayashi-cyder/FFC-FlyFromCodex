name: MarkerTap v1.131 accessibility stability
on:
  push:
    branches: ["markertap/stability-v1.131"]
    paths:
      - ".github/workflows/markertap-v1131-stability.yml"
      - "markertap/v1.131-stability/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: markertap-v1131-stability
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build, audit, test, sign and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 markertap/v1.131-stability/build_ci.py
      - name: Archive verification and signed APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MarkerTap-v1.131-stability
          path: stability-build-results/
          if-no-files-found: warn
          retention-days: 30
