name: BANC888 Threaded Voice APK

on:
  push:
    branches:
      - "banc888-apk-*"
    paths:
      - "app/**"
      - "tests/thread_router_core.test.cjs"
      - "tests/capability_vocabulary.test.cjs"
      - "tests/specialist_capability_v2.test.cjs"
      - "tests/ir_patch_core.test.cjs"
      - "tests/proxy_agent_core.test.cjs"
      - "tests/proxy_apk_integration.test.cjs"
      - ".github/workflows/banc888-threaded-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android sdkmanager
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --list_installed | head -80 || true

      - name: Install Android platform
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Thread router unit tests
        run: |
          node --check app/src/main/assets/thread-router-core.js
          node --check app/src/main/assets/capability-vocabulary-core.js
          node --check app/src/main/assets/ir-patch-core.js
          node --check app/src/main/assets/proxy-agent-core.js
          node --check app/src/main/assets/capability-tools.js
          node --check app/src/main/assets/proxy-agent.js
          node --check app/src/main/assets/thread-router.js
          node tests/thread_router_core.test.cjs
          node tests/capability_vocabulary.test.cjs
          node tests/specialist_capability_v2.test.cjs
          node tests/ir_patch_core.test.cjs
          node tests/proxy_agent_core.test.cjs
          node tests/proxy_apk_integration.test.cjs

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: APK inventory
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BANC888-v5.6-proxy-executive-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
