name: MarkerTap v1.134 freshness and capture completion
on:
  push:
    branches: ["markertap/autonomy-v1.134"]
    paths: ["markertap/v1.134-autonomy/**", ".github/workflows/markertap-v1134-autonomy.yml"]
  pull_request:
    paths: ["markertap/v1.134-autonomy/**", ".github/workflows/markertap-v1134-autonomy.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android tools and verified JADX
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          curl --fail --location --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip -o "$RUNNER_TEMP/jadx.zip"
          echo "8280f3799c0273fe797a2bcd90258c943e451fd195f13d05400de5e6451d15ec  $RUNNER_TEMP/jadx.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
      - name: Build and verify the actual APK
        run: python3 markertap/v1.134-autonomy/build_ci.py --sdk "$ANDROID_HOME" --jadx "$RUNNER_TEMP/jadx/lib/jadx-1.5.3-all.jar"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MarkerTap-v1.134-validation
          path: autonomy-build-results/
          if-no-files-found: error
          retention-days: 30
