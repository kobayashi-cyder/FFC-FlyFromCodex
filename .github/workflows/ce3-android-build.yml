name: Build Ce3 Android APK

on:
  push:
    branches:
      - ce3-connectome-primitives-v0.5
    paths:
      - 'ce3-android/**'
      - '.github/workflows/ce3-android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: ce3-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FFC-Ce3-Connectome-System-v0.5-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FFC-Ce3-Connectome-System-v0.5
          path: ce3-android/app/build/outputs/apk/debug/FFC-Ce3-Connectome-System-v0.5-debug.apk
          if-no-files-found: error
